name: Quality check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node (for node --check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run quality verifier
        run: |
          python scripts/verify.py .